[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "rftvc"
version = "0.1.0.dev0"
description = "Scikit-learn compatible random survival forests with time-varying covariates"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy>=1.24", "scikit-learn>=1.5"]

[dependency-groups]
dev = [
    "maturin>=1.9,<2",
    "pytest>=8",
    "hypothesis>=6",
    "lifelines>=0.29",
    "scikit-survival>=0.23",
]

[tool.maturin]
manifest-path = "rust/rftvc-py/Cargo.toml"
python-source = "src"
module-name = "rftvc._core"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: statistical/benchmark checks, not merge gates"]
addopts = "-m 'not slow'"
