[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "rftvc"
version = "0.1.0"
description = "Scikit-learn compatible random survival forests with time-varying covariates"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Gokhan Ciflikli", email = "gokhanciflikli@gmail.com" }]
keywords = ["survival-analysis", "random-forest", "scikit-learn", "time-varying-covariates"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.24", "scikit-learn>=1.6", "polars>=1.0", "narwhals>=1.30"]

[project.urls]
Homepage = "https://github.com/ciflikli/rftvc"
Documentation = "https://rftvc.readthedocs.io"
Repository = "https://github.com/ciflikli/rftvc"
Changelog = "https://github.com/ciflikli/rftvc/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "maturin>=1.9,<2",
    "pytest>=8",
    "hypothesis>=6",
    "lifelines>=0.29",
    "scikit-survival>=0.23",
    "pandas>=2.0",
    "rdata>=0.11.2",
]
docs = [
    "sphinx>=8",
    "numpydoc>=1.8",
    "pydata-sphinx-theme>=0.16",
]

[tool.maturin]
manifest-path = "rust/rftvc-py/Cargo.toml"
python-source = "src"
module-name = "rftvc._core"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: statistical/benchmark checks, not merge gates",
    "network: fetches third-party data on first run (cached after), not a merge gate",
]
addopts = "-m 'not slow and not network'"
