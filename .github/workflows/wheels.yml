name: wheels

# abi3 wheels (one per platform, CPython >= 3.10) built with maturin, then
# installed and smoke-tested on each OS, then published on any v*-tagged push:
# TestPyPI first (a real upload, not a simulated one — PyPI has no dry-run mode
# for gh-action-pypi-publish; "dry run" here means "against the test index"),
# then PyPI, gated on the same tag and on the TestPyPI upload having succeeded.
# Both jobs also verify the tag's version matches pyproject.toml's before
# uploading anything, so a stale/forgotten version bump fails loudly instead
# of re-publishing (PyPI rejects filename reuse) an already-released version.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "pyproject.toml"
      - "rust/**/Cargo.toml"
      - ".github/workflows/wheels.yml"

jobs:
  build:
    name: build ${{ matrix.target }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: "2014" }
          - { os: ubuntu-latest, target: aarch64, manylinux: "2014" }
          - { os: macos-latest, target: aarch64 }
          - { os: macos-15-intel, target: x86_64 }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  test:
    name: install ${{ matrix.os }} py${{ matrix.python }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - name: Install the wheel for this platform (from dist only)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.24" "scikit-learn>=1.6" "polars>=1.0" "narwhals>=1.30"
          # rftvc itself only from the built wheels, never from an index.
          python -m pip install --no-index --no-deps --only-binary=:all: --find-links dist rftvc
      - name: Smoke test
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import numpy as np, pickle
          from rftvc import SurvivalForestTV, make_survival_y
          rng = np.random.default_rng(0)
          X = rng.normal(size=(300, 3))
          t = rng.exponential(np.exp(-X[:, 0]))
          y = make_survival_y(np.minimum(t, 1.5), t <= 1.5)
          f = SurvivalForestTV(n_estimators=20, n_jobs=2, random_state=0).fit(X, y)
          risk = f.predict_risk(X[:5], 1.0)
          assert np.all((risk >= 0) & (risk <= 1)), risk
          g = pickle.loads(pickle.dumps(f))
          np.testing.assert_allclose(g.predict_risk(X[:5], 1.0), risk)
          c = SurvivalForestTV(n_estimators=20, ntime=10, random_state=0).fit(X, y)
          print("ok", risk.round(3), c.coarse_grid_.size)
          PY
      - name: Check py.typed ships in the installed wheel
        shell: bash
        run: |
          python -c "
          import pathlib, rftvc
          assert (pathlib.Path(rftvc.__file__).parent / 'py.typed').exists(), 'py.typed missing from installed wheel'
          "

  publish-testpypi:
    name: publish to TestPyPI
    needs: [build, sdist, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify the tag matches pyproject.toml's version
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PY_VER=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "([^"]+)"/\1/')
          if [ "$TAG_VER" != "$PY_VER" ]; then
            echo "tag $GITHUB_REF_NAME (version $TAG_VER) != pyproject.toml version $PY_VER"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: publish to PyPI
    needs: [publish-testpypi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
